<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="blossom-petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <linearGradient id="blossom-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="center-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#D1FF42"/>
    </linearGradient>
    <filter id="blossom-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E91E63" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#blossom-shadow)">
    <!-- 8 Blooming Petals -->
    <path d="M60 60 C50 35, 70 35, 60 15 C50 35, 70 35, 60 60 Z" fill="url(#blossom-petal)"/>
    <path d="M60 60 C50 85, 70 85, 60 105 C50 85, 70 85, 60 60 Z" fill="url(#blossom-petal)"/>
    <path d="M60 60 C35 50, 35 70, 15 60 C35 50, 35 70, 60 60 Z" fill="url(#blossom-petal)"/>
    <path d="M60 60 C85 50, 85 70, 105 60 C85 50, 85 70, 60 60 Z" fill="url(#blossom-petal)"/>

    <path d="M60 60 C42 42, 56 28, 28 32 C32 60, 46 46, 60 60 Z" fill="url(#blossom-glow)" opacity="0.95"/>
    <path d="M60 60 C78 42, 92 56, 88 28 C60 32, 74 46, 60 60 Z" fill="url(#blossom-glow)" opacity="0.95"/>
    <path d="M60 60 C78 78, 64 92, 92 88 C88 60, 74 74, 60 60 Z" fill="url(#blossom-glow)" opacity="0.95"/>
    <path d="M60 60 C42 78, 28 64, 32 92 C60 88, 46 74, 60 60 Z" fill="url(#blossom-glow)" opacity="0.95"/>

    <!-- Inner Core & Anthers -->
    <circle cx="60" cy="60" r="13" fill="#101827" stroke="url(#center-gold)" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="7" fill="url(#center-gold)"/>
    
    <!-- Anther Dots -->
    <circle cx="60" cy="45" r="2" fill="#D1FF42"/>
    <circle cx="60" cy="75" r="2" fill="#D1FF42"/>
    <circle cx="45" cy="60" r="2" fill="#D1FF42"/>
    <circle cx="75" cy="60" r="2" fill="#D1FF42"/>
    <circle cx="49" cy="49" r="1.8" fill="#D1FF42"/>
    <circle cx="71" cy="49" r="1.8" fill="#D1FF42"/>
    <circle cx="49" cy="71" r="1.8" fill="#D1FF42"/>
    <circle cx="71" cy="71" r="1.8" fill="#D1FF42"/>
  </g>
</svg>
