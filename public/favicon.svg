<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="blossom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E98"/>
      <stop offset="50%" stop-color="#EC407A"/>
      <stop offset="100%" stop-color="#8E24AA"/>
    </linearGradient>
    <linearGradient id="gold-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#D1FF42"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EC407A" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <rect width="64" height="64" rx="16" fill="#101827"/>
  
  <!-- Flower Petals -->
  <g filter="url(#glow)">
    <!-- Top Petal -->
    <path d="M32 32 C26 18, 38 18, 32 8 C26 18, 38 18, 32 32 Z" fill="url(#blossom-grad)" />
    <!-- Bottom Petal -->
    <path d="M32 32 C26 46, 38 46, 32 56 C26 46, 38 46, 32 32 Z" fill="url(#blossom-grad)" />
    <!-- Left Petal -->
    <path d="M32 32 C18 26, 18 38, 8 32 C18 26, 18 38, 32 32 Z" fill="url(#blossom-grad)" />
    <!-- Right Petal -->
    <path d="M32 32 C46 26, 46 38, 56 32 C46 26, 46 38, 32 32 Z" fill="url(#blossom-grad)" />
    
    <!-- Diagonal Petals -->
    <path d="M32 32 C21 21, 29 13, 15 15 C17 29, 25 25, 32 32 Z" fill="url(#blossom-grad)" opacity="0.9" />
    <path d="M32 32 C43 21, 51 29, 49 15 C35 17, 39 25, 32 32 Z" fill="url(#blossom-grad)" opacity="0.9" />
    <path d="M32 32 C43 43, 35 51, 49 49 C47 35, 39 39, 32 32 Z" fill="url(#blossom-grad)" opacity="0.9" />
    <path d="M32 32 C21 43, 13 35, 15 49 C29 47, 25 39, 32 32 Z" fill="url(#blossom-grad)" opacity="0.9" />
  </g>
  
  <!-- Golden Center Pistil -->
  <circle cx="32" cy="32" r="6" fill="url(#gold-core)" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
