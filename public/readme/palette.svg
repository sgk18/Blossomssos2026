<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="palBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDBC3"/>
      <stop offset="50%" stop-color="#FCEDE3"/>
      <stop offset="100%" stop-color="#F2D3BE"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="swatchShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3D246C" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    .font-heavy { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-med { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="260" rx="16" fill="url(#palBgGrad)"/>
  <rect width="1000" height="260" rx="16" fill="none" stroke="#3D246C" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Top Title & Badge -->
  <g transform="translate(36, 28)">
    <text x="0" y="14" fill="#3D246C" class="font-heavy" font-size="16" letter-spacing="0.5">OFFICIAL BRAND COLOR PALETTE</text>
    <text x="310" y="14" fill="#5C4B99" class="font-mono" font-size="11.5" font-weight="600">Colour Hunt Curated • WCAG 2.2 AA / AAA Compliant</text>
  </g>

  <!-- SWATCH 1: Peach (#FFDBC3) -->
  <g transform="translate(36, 56)" filter="url(#swatchShadow)">
    <rect width="214" height="176" rx="12" fill="#FFFFFF" stroke="#3D246C" stroke-width="1" stroke-opacity="0.12"/>
    <!-- Color Chip -->
    <rect x="10" y="10" width="194" height="76" rx="8" fill="#FFDBC3" stroke="#E2BFA7" stroke-width="1"/>
    <!-- Metadata -->
    <text x="14" y="106" fill="#3D246C" class="font-heavy" font-size="14">PEACH</text>
    <rect x="156" y="93" width="48" height="18" rx="4" fill="#FFDBC3" stroke="#3D246C" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="180" y="106" fill="#3D246C" class="font-mono" font-size="9" font-weight="700" text-anchor="middle">BASE</text>
    <text x="14" y="124" fill="#5C4B99" class="font-mono" font-size="12" font-weight="700">#FFDBC3</text>
    <text x="14" y="140" fill="#6B5B8E" class="font-mono" font-size="10">RGB (255, 219, 195)</text>
    <text x="14" y="160" fill="#3D246C" class="font-med" font-size="10.5">Canvas &amp; Surface Base</text>
    <text x="14" y="174" fill="#7D6D9B" class="font-mono" font-size="9">--color-peach</text>
  </g>

  <!-- SWATCH 2: Soft Lavender (#9F91CC) -->
  <g transform="translate(274, 56)" filter="url(#swatchShadow)">
    <rect width="214" height="176" rx="12" fill="#FFFFFF" stroke="#3D246C" stroke-width="1" stroke-opacity="0.12"/>
    <!-- Color Chip -->
    <rect x="10" y="10" width="194" height="76" rx="8" fill="#9F91CC"/>
    <!-- Metadata -->
    <text x="14" y="106" fill="#3D246C" class="font-heavy" font-size="14">LAVENDER</text>
    <rect x="146" y="93" width="58" height="18" rx="4" fill="#EFEBFA"/>
    <text x="175" y="106" fill="#5C4B99" class="font-mono" font-size="9" font-weight="700" text-anchor="middle">ACCENT</text>
    <text x="14" y="124" fill="#5C4B99" class="font-mono" font-size="12" font-weight="700">#9F91CC</text>
    <text x="14" y="140" fill="#6B5B8E" class="font-mono" font-size="10">RGB (159, 145, 204)</text>
    <text x="14" y="160" fill="#3D246C" class="font-med" font-size="10.5">Glow, Fiber &amp; Borders</text>
    <text x="14" y="174" fill="#7D6D9B" class="font-mono" font-size="9">--color-lavender</text>
  </g>

  <!-- SWATCH 3: Royal Purple (#5C4B99) -->
  <g transform="translate(512, 56)" filter="url(#swatchShadow)">
    <rect width="214" height="176" rx="12" fill="#FFFFFF" stroke="#3D246C" stroke-width="1" stroke-opacity="0.12"/>
    <!-- Color Chip -->
    <rect x="10" y="10" width="194" height="76" rx="8" fill="#5C4B99"/>
    <!-- Metadata -->
    <text x="14" y="106" fill="#3D246C" class="font-heavy" font-size="14">ROYAL PURPLE</text>
    <rect x="142" y="93" width="62" height="18" rx="4" fill="#F0ECFB"/>
    <text x="173" y="106" fill="#5C4B99" class="font-mono" font-size="9" font-weight="700" text-anchor="middle">PRIMARY</text>
    <text x="14" y="124" fill="#5C4B99" class="font-mono" font-size="12" font-weight="700">#5C4B99</text>
    <text x="14" y="140" fill="#6B5B8E" class="font-mono" font-size="10">RGB (92, 75, 153)</text>
    <text x="14" y="160" fill="#3D246C" class="font-med" font-size="10.5">CTAs, Badges &amp; Headers</text>
    <text x="14" y="174" fill="#7D6D9B" class="font-mono" font-size="9">--color-royal-purple</text>
  </g>

  <!-- SWATCH 4: Deep Purple (#3D246C) -->
  <g transform="translate(750, 56)" filter="url(#swatchShadow)">
    <rect width="214" height="176" rx="12" fill="#FFFFFF" stroke="#3D246C" stroke-width="1" stroke-opacity="0.12"/>
    <!-- Color Chip -->
    <rect x="10" y="10" width="194" height="76" rx="8" fill="#3D246C"/>
    <!-- Metadata -->
    <text x="14" y="106" fill="#3D246C" class="font-heavy" font-size="14">DEEP PURPLE</text>
    <rect x="150" y="93" width="54" height="18" rx="4" fill="#3D246C"/>
    <text x="177" y="106" fill="#FFDBC3" class="font-mono" font-size="9" font-weight="700" text-anchor="middle">DARK</text>
    <text x="14" y="124" fill="#5C4B99" class="font-mono" font-size="12" font-weight="700">#3D246C</text>
    <text x="14" y="140" fill="#6B5B8E" class="font-mono" font-size="10">RGB (61, 36, 108)</text>
    <text x="14" y="160" fill="#3D246C" class="font-med" font-size="10.5">Display Text &amp; Identity</text>
    <text x="14" y="174" fill="#7D6D9B" class="font-mono" font-size="9">--color-deep-purple</text>
  </g>
</svg>
